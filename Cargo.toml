[package]
name = "journalview"
version = "0.1.0"
edition = "2021"
authors = ["Vijo Cherian <codervijo@gmail.com>"]
description = "A fast terminal UI for browsing journalctl logs by systemd unit."
license = "MIT"
repository = "https://github.com/codervijo/journalview"
homepage = "https://github.com/codervijo/journalview"
documentation = "https://docs.rs/journalview"
readme = "README.md"
keywords = ["journalctl", "systemd", "tui", "logs", "ratatui"]
categories = ["command-line-utilities", "development-tools::debugging"]

[dependencies]
chrono = "0.4.39"
crossterm = "0.24"
lazy_static = "1.5.0"
log = "0.4.22"
once_cell = "1.20.2"
ratatui = { version = "0.30.0-alpha.0" }
